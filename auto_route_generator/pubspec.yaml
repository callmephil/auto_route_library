name: auto_route_generator
description: AutoRoute is a declarative routing solution, where everything needed for navigation is automatically generated for you.
version: 12.0.0-rc.1
homepage: https://github.com/Milad-Akarie/auto_route_library
environment:
  sdk: ">=3.13.0 <4.0.0"
resolution: workspace

publish_to: none

dependencies:
  analyzer: ^14.5.0
  auto_route: ^13.0.0-rc.1
  build: ">=4.0.0 <6.0.0"
  code_builder: ^4.11.1
  dart_style: ^3.1.5
  glob: ^2.1.3
  meta: ^1.16.0
  path: ^1.9.1
  source_gen: ">=3.1.0 <5.0.0"

dev_dependencies:
  # 3.5.21, not 3.5.23: 3.5.23 needs build 5, and mockito, which auto_route's
  # tests use in the same workspace, needs build below 5.
  build_test: ^3.5.21
  test: ^1.28.0
  very_good_analysis: ^11.0.0

