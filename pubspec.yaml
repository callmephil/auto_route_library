# A Dart pub workspace: auto_route, its example and the generator resolve
# together, so the example and the generator's tests always run on the local
# auto_route, and the example on the local generator.
name: auto_route_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - auto_route
  - auto_route/example.old
  - auto_route_generator

